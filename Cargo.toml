[workspace]
resolver = "3"
members = ["crates/*", "bench/gen", "tests/support", "xtask"]
# cargo-fuzz targets need a nightly toolchain and their own lockfile.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cheby-lang/cheby"

[workspace.dependencies]
# Internal crates.
cheby_codegen_clif = { path = "crates/cheby_codegen_clif" }
cheby_consteval = { path = "crates/cheby_consteval" }
cheby_diag = { path = "crates/cheby_diag" }
cheby_doc = { path = "crates/cheby_doc" }
cheby_driver = { path = "crates/cheby_driver" }
cheby_fmt = { path = "crates/cheby_fmt" }
cheby_iface = { path = "crates/cheby_iface" }
cheby_jit = { path = "crates/cheby_jit" }
cheby_js = { path = "crates/cheby_js" }
cheby_link = { path = "crates/cheby_link" }
cheby_lsp = { path = "crates/cheby_lsp" }
cheby_mir = { path = "crates/cheby_mir" }
cheby_package = { path = "crates/cheby_package" }
cheby_pkg = { path = "crates/cheby_pkg" }
cheby_repl = { path = "crates/cheby_repl" }
cheby_resolve = { path = "crates/cheby_resolve" }
cheby_runtime = { path = "crates/cheby_runtime" }
cheby_syntax = { path = "crates/cheby_syntax" }
cheby_types = { path = "crates/cheby_types" }

# Test and bench support.
cheby_bench_gen = { path = "bench/gen" }
cheby_test_support = { path = "tests/support" }

# External crates.
astro-float = "0.9.6"
clap = { version = "4.6", features = ["derive"] }
cranelift-codegen = "0.135"
cranelift-frontend = "0.135"
cranelift-jit = "0.135"
cranelift-module = "0.135"
cranelift-native = "0.135"
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
getrandom = "0.3"
libc = "0.2"
libtest-mimic = "0.8"
loom = "0.7"
mio = { version = "1", features = ["os-poll"] }
parking_lot = "0.12"
proptest = "1.11"
rayon = "1.12"
rustc-hash = "2.1"
rustyline = { version = "18.0", default-features = false }
ryu = "1"
serde_json = "1"
siphasher = "1"
toml = { version = "1.1", features = ["preserve_order"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2"
# The instruction-cache maintenance cranelift-jit itself uses; the version
# follows cranelift (0.135 is Wasmtime 48).
wasmtime-internal-jit-icache-coherence = "48"
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.dev]
debug = "line-tables-only"

# The debug toolchain compiles Cheby code with an optimized Cranelift and
# runs it on an optimized runtime (plan §4.4); `debug-assertions` stay on,
# so the leak check and poisoning still work. D-259 governs the generated
# code, not how the compiler is built.
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3

[profile.dev.package.cranelift-bforest]
opt-level = 3

[profile.dev.package.cranelift-bitset]
opt-level = 3

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-control]
opt-level = 3

[profile.dev.package.cranelift-entity]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.cranelift-jit]
opt-level = 3

[profile.dev.package.cranelift-module]
opt-level = 3

[profile.dev.package.cranelift-native]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.cheby_runtime]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
