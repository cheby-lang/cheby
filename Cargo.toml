[workspace]
resolver = "3"
members = ["crates/*", "bench/baselines", "bench/gen", "tests/support", "xtask"]
# cargo-fuzz targets need a nightly toolchain and their own lockfile.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cheby-lang/cheby"

[workspace.dependencies]
# Internal crates.
cheby_codegen_clif = { path = "crates/cheby_codegen_clif" }
cheby_consteval = { path = "crates/cheby_consteval" }
cheby_diag = { path = "crates/cheby_diag" }
cheby_doc = { path = "crates/cheby_doc" }
cheby_driver = { path = "crates/cheby_driver" }
cheby_fmt = { path = "crates/cheby_fmt" }
cheby_iface = { path = "crates/cheby_iface" }
cheby_jit = { path = "crates/cheby_jit" }
cheby_js = { path = "crates/cheby_js" }
cheby_link = { path = "crates/cheby_link" }
cheby_lsp = { path = "crates/cheby_lsp" }
cheby_mir = { path = "crates/cheby_mir" }
cheby_package = { path = "crates/cheby_package" }
cheby_pkg = { path = "crates/cheby_pkg" }
cheby_repl = { path = "crates/cheby_repl" }
cheby_resolve = { path = "crates/cheby_resolve" }
cheby_runtime = { path = "crates/cheby_runtime" }
cheby_syntax = { path = "crates/cheby_syntax" }
cheby_types = { path = "crates/cheby_types" }

# Test and bench support.
cheby_bench_gen = { path = "bench/gen" }
cheby_test_support = { path = "tests/support" }

# External crates.
astro-float = "0.9.6"
clap = { version = "4.6", features = ["derive"] }
# Shell completion that asks `cheby` for its candidates (D-1958). The engine
# is behind an unstable feature: read its changelog before a bump.
clap_complete = { version = "4.6.12", features = ["unstable-dynamic"] }
cranelift-codegen = "0.135"
cranelift-frontend = "0.135"
cranelift-jit = "0.135"
cranelift-module = "0.135"
cranelift-object = "0.135"
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
getrandom = "0.3"
# DWARF line tables in replayed objects (D-938); the version Cranelift
# already locks (D-1036).
gimli = { version = "0.33", default-features = false, features = ["std", "write"] }
httparse = "1.10"
libc = "0.2"
libmimalloc-sys = { version = "0.1.49", default-features = false }
libtest-mimic = "0.8"
loom = "0.7"
# The language server's protocol (D-1351): synchronous, LSP 3.17.
lsp-server = "0.10"
lsp-types = "0.97"
memchr = "2.8.3"
mio = { version = "1", features = ["os-poll"] }
object = { version = "0.39", default-features = false, features = ["read", "std"] }
parking_lot = "0.12"
proptest = "1.11"
rayon = "1.12"
# HTTPS for `std::http`'s client (D-1011, D-1036): only on targets other
# than Windows until M6.
ring = "0.17.14"
# `cargo xtask junit-report` reads nextest's JUnit XML (D-1559).
roxmltree = "0.21"
rustc-hash = "2.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustyline = { version = "18.0", default-features = false }
ryu = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
siphasher = "1"
socket2 = "0.6"
toml = { version = "1.1", features = ["preserve_order"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2"
# The instruction-cache maintenance cranelift-jit itself uses; the version
# follows cranelift (0.135 is Wasmtime 48).
wasmtime-internal-jit-icache-coherence = "48"
webpki-roots = "1.0.10"
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
# D-875: the sanitizer builds (D-721) pass
# `--cfg cheby_sanitize="address"` or `"thread"` with `-Zsanitizer`;
# `crates/cheby_runtime/src/fiber/sanitizer.rs` reads it.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(cheby_sanitize, values("address", "thread"))',
] }
# D-1560: lints that are cheap to keep clean.
elided_lifetimes_in_paths = "deny"
meta_variable_misuse = "deny"
non_ascii_idents = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unreachable_pub = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"

# D-1560: the docs are built with `--document-private-items`, for the
# people who work on the compiler, so a link to a private item resolves.
[workspace.lints.rustdoc]
private_intra_doc_links = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
# D-1560: exemptions only through `#[expect]` with a reason (D-422).
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# D-1560: every `unsafe` block states its invariant.
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
# D-1560: hash iteration order must not reach the output.
iter_over_hash_type = "deny"
# D-1560: a new variant is an error wherever its enum is matched.
wildcard_enum_match_arm = "deny"
# D-1560: other restriction lints.
as_underscore = "deny"
clone_on_ref_ptr = "deny"
cfg_not_test = "deny"
dbg_macro = "deny"
deref_by_slicing = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
filetype_is_file = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
format_push_string = "deny"
get_unwrap = "deny"
infinite_loop = "deny"
mixed_read_write_in_expression = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
needless_raw_strings = "deny"
pathbuf_init_then_push = "deny"
rc_mutex = "deny"
redundant_test_prefix = "deny"
same_name_method = "deny"
str_to_string = "deny"
string_lit_chars_any = "deny"
try_err = "deny"
unneeded_field_pattern = "deny"
unnecessary_self_imports = "deny"
verbose_file_reads = "deny"
# D-1560: `nursery` lints picked one by one (D-423 keeps the group off).
derive_partial_eq_without_eq = "deny"
equatable_if_let = "deny"
or_fun_call = "deny"
redundant_clone = "deny"
significant_drop_in_scrutinee = "deny"
useless_let_if_seq = "deny"
# D-1560: `cargo` lints.
negative_feature_names = "deny"
redundant_feature_names = "deny"
wildcard_dependencies = "deny"

# The tests run the compiler far more than they build it, and most of their
# time was unoptimized front-end code (D-1900). `debug-assertions` and
# `overflow-checks` stay on.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

# The debug toolchain compiles Cheby code with an optimized Cranelift and
# runs it on an optimized runtime (plan §4.4); `debug-assertions` stay on,
# so the leak check and poisoning still work. D-259 governs the generated
# code, not how the compiler is built.
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3

[profile.dev.package.cranelift-bforest]
opt-level = 3

[profile.dev.package.cranelift-bitset]
opt-level = 3

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-control]
opt-level = 3

[profile.dev.package.cranelift-entity]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.cranelift-jit]
opt-level = 3

[profile.dev.package.cranelift-module]
opt-level = 3

[profile.dev.package.cranelift-native]
opt-level = 3

[profile.dev.package.cranelift-object]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.cheby_runtime]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"

# Rust 1.100's std follows Unicode 18.0.0, and unicode-segmentation's latest
# release, 1.13.3, still follows 17.0.0. Its master moved to 18.0.0 in
# unicode-rs/unicode-segmentation#184, unreleased. D-552 needs both on one
# version (crates/cheby_runtime/src/text/tests.rs), so the crate comes from
# that commit's descendant until a release has it; then drop this patch and
# deny.toml's allow-git entry. A patch, not a git dependency, so rustyline
# uses the same copy.
[patch.crates-io]
unicode-segmentation = { git = "https://github.com/unicode-rs/unicode-segmentation", rev = "2368a49833e4b6dd0e933a8485dd96599e72c870" }
