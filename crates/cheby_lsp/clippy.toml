# Raw handle numbers are banned everywhere, `features` included.
disallowed-methods = [
  { path = "cheby_iface::ModuleId::as_u32", reason = "a raw handle number must not leave a handler" },
  { path = "cheby_iface::ModuleId::from_u32", reason = "a raw handle number must not enter a handler" },
  { path = "cheby_iface::DefIndex::as_u32", reason = "a raw handle number must not leave a handler" },
