[package]
name = "cheby_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "cheby"
path = "src/main.rs"

[dependencies]
clap.workspace = true
cheby_diag.workspace = true
cheby_doc.workspace = true
cheby_driver.workspace = true
cheby_fmt.workspace = true
cheby_lsp.workspace = true
cheby_pkg.workspace = true
cheby_repl.workspace = true
cheby_runtime.workspace = true
mimalloc.workspace = true

[dev-dependencies]
cheby_test_support.workspace = true
# `tests/build_dwarf.rs` reads an executable's line tables (D-938).
gimli = { workspace = true, features = ["read"] }
libtest-mimic.workspace = true
# `tests/build.rs` compares the load commands of two executables (D-934,
# D-1036).
object.workspace = true
# `src/build_id.rs`'s tests include `build.rs` (D-957).
siphasher.workspace = true

# `tests/tls.rs`'s server on loopback (D-1011); TLS is not built on
# Windows until M6.
[target.'cfg(not(windows))'.dev-dependencies]
rustls.workspace = true

# `build.rs` computes the build ID (D-957).
[build-dependencies]
siphasher.workspace = true

# The harnesses live under tests/ at the repository root (docs/plan/testing.md),
# but are test targets of this crate so that `cargo test` builds `cheby` first.
[[test]]
name = "conformance"
path = "../../tests/conformance/main.rs"
harness = false

[[test]]
name = "ui"
path = "../../tests/ui_harness/main.rs"
harness = false

# REPL transcripts under tests/repl/ (plan §8.3, D-546).
[[test]]
name = "repl"
path = "../../tests/repl_harness/main.rs"
harness = false

[lints]
workspace = true
